<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livraria LivraLendo - Catálogo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <h1 class="brand-title">Livra<span>Lendo</span></h1>
        <nav class="main-nav">
          <a href="index.html" class="nav-link">Home</a>
          <a href="catalogo.html" class="nav-link ativo">Catálogo</a>
          <a href="carrinho.html" class="nav-link"
            >Carrinho (<span id="contadorCarrinho">0</span>)</a
          >
          <a href="contato.html" class="nav-link">Sobre / Contato</a>
        </nav>
        <button id="themeBtn" class="theme-btn">🌙 Escuro</button>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Catálogo de Livros</h2>

        <div class="controles-catalogo">
          <input
            type="text"
            id="inputBusca"
            placeholder="Buscar por título ou autor..."
          />
          <div id="filtrosCategoria" class="categorias-btns">
            <button class="cat-btn ativo" data-cat="todos">Todas</button>
            <button class="cat-btn" data-cat="Romance">Romance</button>
            <button class="cat-btn" data-cat="Fantasia">Fantasia</button>
            <button class="cat-btn" data-cat="Técnicos">Técnicos</button>
            <button class="cat-btn" data-cat="Infantil">Infantil</button>
          </div>
        </div>

        <div id="listaProdutos" class="grid"></div>
      </section>
    </main>

    <footer>
      <div class="footer">
        <p>&copy; 2026 Livraria LivraLendo</p>
        <p><strong>Endereço:</strong> Avenida Paulista, 100 - São Paulo/SP</p>
      </div>
    </footer>

    <div id="modalDetalhes" class="modal hidden">
      <div class="modal-content">
        <button class="close-btn" onclick="fecharModal()">&times;</button>
        <div id="conteudoModal"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
